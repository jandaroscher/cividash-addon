# ---------------------------------------------------------
# Default inventory for the CiviDash CIVITAS/CORE Add-on
# ---------------------------------------------------------
# Override any of these in your platform inventory. The add-on is activated
# via the inv_addons.import hook documented in the README.
# ---------------------------------------------------------

---
all:
  children:
    controller:
      vars:
        inv_addons:
          cividash:
            # --- lifecycle --------------------------------------------------
            enable: true
            ns_create: true
            ns_name: "{{ ENVIRONMENT }}-cividash-stack"
            ns_kubeconfig: "{{ kubeconfig_file | default('kubeconfig') }}"

            # --- ingress / routing -----------------------------------------
            # When true, the public Ingress is created AND the open APISIX
            # gateway route is registered (tasks/apisix.yml).
            enable_ingress: true
            # Public hostname the dashboard (and its /admin, /api, /filament,
            # /docs paths) is served on. One open APISIX route -> cividash-web.
            public_host: "dashboard.{{ DOMAIN }}"
            # Admin host for the Keycloak Socialite SSO callback. Defaults to
            # the public host (admin lives under /admin on the same host).
            admin_host: "dashboard.{{ DOMAIN }}"
            # Set to false to disable the ingress-nginx SSL redirect (e.g. TLS
            # terminated upstream of the ingress controller). Read by
            # templates/values.yaml.j2 into chart values ingress.sslRedirect.
            open_http_port: true

            # --- production hardening ---------------------------------------
            # Laravel LOG_LEVEL/LOG_CHANNEL. stderr suits containers: captured
            # by the cluster's log driver instead of a file no one rotates.
            log_level: info
            log_channel: stderr
            # Requires TLS in front of cividash-web (true by default, matching
            # open_http_port's SSL redirect above).
            session_secure_cookie: true

            # --- Keycloak ---------------------------------------------------
            # cividash client, used by the APP (not by APISIX) for the
            # Socialite admin SSO standard flow ONLY. The NGSI-LD machine token
            # is issued by the shared operator-provided "api-access" client,
            # not by this client (see ngsi_ld_roles below).
            oidc_client_id: "{{ IDM_CLIENT_CIVIDASH | default('cividash') }}"
            # NGSI-LD machine token (CIVITAS_OAUTH_*) is fetched automatically
            # from the platform's existing "api-access" IDM client — the same
            # client the CORE data plane (Stellio behind APISIX) already trusts,
            # mirroring redpandaconnect_addon. No manual token management. The
            # add-on ensures the api-access service account carries these
            # purpose-scoped client roles, which make Keycloak mint the
            # api:read/api:write scopes the CORE APISIX gateway enforces. The
            # CiviDash backend both reads and writes NGSI-LD, hence both by default.
            # Override only to narrow the granted access.
            # ngsi_ld_roles: ["dataConsumer", "dataProducer"]
            # OAuth scope the app's NgsiLdClient requests for the NGSI-LD machine
            # token (written to cividash-oidc-secret as CIVITAS_OAUTH_SCOPE) and the
            # scope the deploy-time M2M preflight requests. Must match the scopes
            # the CORE APISIX gateway enforces in front of Stellio.
            ngsi_ld_scope: "api:read api:write"
            # Deploy-time M2M preflight (tasks/preflight_m2m.yml): after
            # keycloak_sso, verify the shared api-access client can mint a USABLE
            # NGSI-LD token — serviceAccountsEnabled=true (a token is issued) and
            # a non-empty "tenants" claim (Stellio grants tenant access). Both
            # are OPERATOR provisioning prerequisites (see docs/authentication.md, "Operator
            # prerequisites (M2M / api-access)"); the add-on only probes them and
            # fails loudly. Set false to consciously skip the check.
            m2m_preflight_enabled: true
            # In-cluster Keycloak URL for the SSO callback's server-side token
            # exchange (avoids needing the platform CA in the app trust store).
            # Defaults to the CORE Keycloak service "idmkeycloak.<env>-access-stack";
            # override if your platform names the service/namespace differently.
            # keycloak_base_url_internal: "http://idmkeycloak.{{ ENVIRONMENT }}-access-stack.svc.cluster.local"

            # --- workload scaling ------------------------------------------
            replicas:
              web: 2
              fpm: 2

            # --- initial config data (cividash-seed Helm hook Job) --------------
            # Runs after migrate/workloads on every install/upgrade. Every
            # step is idempotent (see chart/cividash/templates/cividash-seed.yaml).
            seed:
              enabled: true
              # The CiviDash pages:seed/dashboard:seed seeders hardcode the
              # tenant slug "default", so `pages: true` or a non-empty
              # dashboard_json_url require this to stay "default" (the chart
              # fails to render otherwise).
              default_tenant: default
              # Sets the default tenant's `domain` to public_host; only
              # writes when it actually differs.
              set_tenant_domain: true
              # Seeds the reference pages/navigation (php artisan pages:seed).
              # Off by default: only meaningful for the Regensburg reference
              # content. Requires default_tenant: default.
              pages: false
              # Non-empty: seeds Tiles/Categories/Metrics from this
              # dashboard.json URL (php artisan dashboard:seed --url=...).
              # Requires default_tenant: default.
              # dashboard_json_url: "https://example.org/dashboard.json"

            # --- Helm chart overrides ----------------------------------------
            # Passed as helm_values_rcombine to tasks/templates/k8s-helm.yml —
            # combined (recursive) on top of the values rendered from this
            # inventory in templates/values.yaml.j2. Use it to reach chart
            # values that have no dedicated inv_addons.cividash.* key yet
            # (e.g. per-workload resources.*).
            # helm_values:
            #   resources:
            #     fpm:
            #       limits: { cpu: "2", memory: 1Gi }

            # Gateway API (HTTPRoute) instead of / alongside the Ingress. Off
            # by default; when enabled, parentRefs must name an existing
            # Gateway.
            # gateway_api:
            #   enabled: true
            #   parentRefs:
            #     - name: "{{ ENVIRONMENT }}-gateway"
            #       namespace: gateway-system

            # --- database (external PostgreSQL) ----------------------------
            # The add-on ships no database server of its own.
            # It connects to an externally-provided PostgreSQL — host, database,
            # user and password are supplied by the CORE operator (e.g. an own
            # Zalando cluster or preparedDatabases). host + password are REQUIRED (no default) and
            # MUST come from your vaulted inventory; database/username/port
            # default in templates/values.yaml.j2. Uncomment to override the defaults:
            # db:
            #   host: "cividash-postgres.core-postgres.svc.cluster.local"  # REQUIRED, provided by the CORE operator
            #   port: 5432
            #   database: "cividash"
            #   username: "cividash"
            #   password: "<from your vaulted inventory>"  # REQUIRED

            # --- CIVITAS / NGSI-LD -----------------------------------------
            # Base URL of the CORE context broker; the app appends /context/ngsi-ld.
            civitas_api_url: "https://api.{{ DOMAIN }}"

            # --- object storage (CORE RustFS / S3) for the public media disk -
            s3:
              endpoint: "https://s3.{{ DOMAIN }}"
              bucket: "cividash"
              public_url: "https://s3.{{ DOMAIN }}/cividash"
              region: "us-east-1"
              # access_key_id: ""   # REQUIRED, supply via vaulted inventory
              # secret_access_key: ""  # REQUIRED, supply via vaulted inventory
