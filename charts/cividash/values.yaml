# Default values for the cividash chart.

images:
  app:
    registry: ghcr.io
    repository: jandaroscher/cividash-app
    # Chart-default only, for lint/template; the add-on's values set the
    # immutable CiviDash release tag from images.yaml. Never deploy
    # "civitas", a moving tag.
    tag: civitas
    pullPolicy: Always
  web:
    registry: ghcr.io
    repository: jandaroscher/cividash-web
    # Chart-default only, for lint/template; the add-on's values set the
    # immutable CiviDash release tag from images.yaml. Never deploy
    # "civitas", a moving tag.
    tag: civitas
    pullPolicy: Always
  # Set to a non-empty string to reference an existing imagePullSecrets Secret.
  pullSecret: ""

replicas:
  fpm: 2
  web: 2
  # Queue workers share the database queue, so more than one is safe. The
  # scheduler always runs exactly once (Recreate strategy, no setting).
  queue: 1

app:
  # Public host the app is served on (also used for the Ingress/HTTPRoute
  # host). Required when ingress.enabled or gatewayApi.enabled is true.
  publicHost: ""
  # APP_KEY from an existing Secret (CIVITAS/CORE 2: generated by secrets.yaml).
  # Laravel accepts a 32-character raw key or "base64:" + 32 bytes. Keep the
  # key when migrating an installation: encrypted values and sessions depend
  # on it.
  keySecret:
    name: ""
    key: app-key
  # Production defaults. LOG_CHANNEL=stderr suits containers (captured by the
  # cluster's log driver instead of writing to a file no one rotates).
  # SESSION_SECURE_COOKIE requires TLS in front of cividash-web. The Ingress
  # terminates TLS itself; with Gateway API the referenced Gateway needs an
  # HTTPS listener, otherwise set this to false.
  logLevel: info
  logChannel: stderr
  sessionSecureCookie: true

  # Object storage for public media, used only with storage.type=s3.
  s3:
    # Name of a Secret the operator creates in the release namespace, with the
    # keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (required for s3).
    existingSecret: ""
    endpoint: ""
    bucket: ""
    publicUrl: ""
    region: us-east-1
    # Path-style URLs (endpoint/bucket/key), which self-hosted S3 such as MinIO expects.
    usePathStyle: true

# CIVITAS/CORE data sync. Off until CORE 2 offers NGSI-LD (see README).
civitas:
  enabled: false
  # "ngsi-ld" or "sensorthings"
  driver: ngsi-ld
  apiUrl: ""

# Admin login through the platform's Keycloak (Socialite). The client secret
# comes from an existing Secret; CORE 2 generates keycloak-client-<clientId>.
keycloak:
  enabled: false
  # Public Keycloak URL without the realm path, e.g. https://idm.example.org
  baseUrl: ""
  # Optional URL the app uses for the server-side token exchange, if it
  # differs from baseUrl.
  baseUrlInternal: ""
  realm: ""
  clientId: cividash
  clientSecret:
    name: ""
    key: client-secret

# Where uploaded public media (logos, tile images, page images) are stored.
storage:
  # "s3" (default): an S3-compatible bucket, configured under app.s3.
  # "volume": a PersistentVolumeClaim mounted into every PHP pod and into
  # cividash-web, which serves the files under /storage.
  type: s3
  volume:
    # Leave empty for the cluster's default StorageClass. With more than one
    # node, use a class that supports ReadWriteMany (CORE:
    # global.storage.storageClass.rwx), since fpm, queue, scheduler and web
    # pods share the volume.
    storageClassName: ""
    accessMode: ReadWriteMany
    size: 5Gi

# Private CA that signs the platform's TLS certificates (Keycloak), read from
# an existing Secret. Empty secretName: the image's system CAs only. CORE 2
# distributes its self-signed CA as Secret custom-ca-cert, key ca.crt.
platformCa:
  secretName: ""
  key: ca.crt

db:
  host: ""
  port: 5432
  database: cividash
  username: cividash
  # Existing Secret with the database password (required).
  passwordSecret:
    name: ""
    key: password

ingress:
  # Off by default: app.publicHost must be set before enabling. The add-on's
  # values enable it with the class and issuer from global.ingress.
  enabled: false
  # Traefik is the default ingress controller. Any other controller works by
  # changing className and annotations.
  className: traefik
  tlsSecretName: ""
  clusterIssuer: ""
  # Free-form annotations, rendered unchanged on the Ingress (after the
  # cert-manager ones; do not repeat the cert-manager keys here). For an
  # HTTP -> HTTPS redirect on Traefik, either serve the router on the TLS
  # entrypoint only:
  #   traefik.ingress.kubernetes.io/router.entrypoints: websecure
  # or attach a redirect Middleware:
  #   traefik.ingress.kubernetes.io/router.middlewares: <namespace>-<name>@kubernetescrd
  annotations: {}

# Gateway API (HTTPRoute) is an alternative to the Ingress above. Both can be
# disabled independently; enabling gatewayApi does not disable ingress.
gatewayApi:
  enabled: false
  parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-system

# Optional NetworkPolicies (off by default): deny all ingress to the chart's
# pods except cividash-web on 8080 from the peers listed in webFrom (the
# ingress controller, APISIX or a Gateway), and cividash-fpm on 9000 from
# cividash-web. Egress is not restricted.
networkPolicy:
  enabled: false
  webFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: kube-system
  #   podSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: traefik

# Initial config data, seeded by the cividash-seed Helm hook Job (post-install,
# post-upgrade) after migrate/workloads. Every step is idempotent, see
# templates/cividash-seed.yaml.
seed:
  enabled: true
  # The CiviDash pages:seed/dashboard:seed seeders hardcode the tenant slug
  # "default" (BelongsToTenant creating-hook + DashboardSeedCommand fallback
  # chain), so `pages: true` or a non-empty `dashboardJsonUrl` require this to
  # stay "default" — the chart refuses to render otherwise.
  defaultTenant: default
  # Set the default tenant's `domain` to app.publicHost. Only writes when
  # app.publicHost is set and the domain actually differs.
  setTenantDomain: true
  # Off by default: seeds neutral example pages and navigation (home,
  # contact, imprint, privacy; php artisan pages:seed) to replace with your
  # own. Runs on every install and upgrade and resets edited pages with the
  # same slugs, so turn it off again after the first seed.
  # Requires defaultTenant: default.
  pages: false
  # Non-empty: seeds Tiles/Categories/Metrics from a dashboard.json URL
  # (php artisan dashboard:seed --url=...). Idempotent. Empty = skipped.
  # Requires defaultTenant: default.
  dashboardJsonUrl: ""

# PodDisruptionBudgets (minAvailable: 1) for cividash-fpm and cividash-web.
# Only useful with 2 or more replicas.
podDisruptionBudget:
  enabled: false

# Linkerd: a Server for the cividash-web port, so the ingress controller can
# reach it when the namespace enforces mTLS. allowUnauthenticated: true accepts
# plaintext from an unmeshed ingress controller; false requires it to be meshed.
linkerd:
  enabled: false
  allowUnauthenticated: false

resources:
  fpm:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  web:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
  queue:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  scheduler:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  migrate:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  seed:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
