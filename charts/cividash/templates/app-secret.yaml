{{/*
cividash-app-secret — Laravel application environment (APP_KEY comes from app.keySecret).
Rendered as a pre-install/pre-upgrade hook (weight 0) so it exists before the
cividash-migrate Job (weight 5) and the workloads run; "before-hook-creation" keeps
it in place afterwards (no hook-succeeded delete) for envFrom to pick up.
*/}}
{{- if not (has .Values.storage.type (list "s3" "volume")) }}
{{- fail (printf "storage.type must be \"s3\" or \"volume\", got %q" .Values.storage.type) }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: cividash-app-secret
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-app
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
stringData:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://{{ .Values.app.publicHost }}"
  TRUSTED_PROXIES: "*"

  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  LOG_CHANNEL: {{ .Values.app.logChannel | quote }}

  SESSION_DRIVER: "database"
  SESSION_SECURE_COOKIE: {{ .Values.app.sessionSecureCookie | quote }}
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"

{{- if eq .Values.storage.type "volume" }}
  # Local disk on the cividash-public-media volume, served by nginx under /storage.
  PUBLIC_DISK_DRIVER: "local"
{{- else }}
  PUBLIC_DISK_DRIVER: "s3"
  AWS_DEFAULT_REGION: {{ .Values.app.s3.region | quote }}
  AWS_ENDPOINT: {{ .Values.app.s3.endpoint | quote }}
  AWS_USE_PATH_STYLE_ENDPOINT: {{ .Values.app.s3.usePathStyle | quote }}
  PUBLIC_S3_BUCKET: {{ .Values.app.s3.bucket | quote }}
  FILESYSTEM_PUBLIC_URL: {{ .Values.app.s3.publicUrl | quote }}
{{- end }}

  CIVITAS_ENABLED: {{ .Values.civitas.enabled | quote }}
{{- if .Values.civitas.enabled }}
  CIVITAS_DRIVER: {{ .Values.civitas.driver | quote }}
  CIVITAS_API_URL: {{ required "civitas.apiUrl is required when civitas.enabled" .Values.civitas.apiUrl | quote }}
{{- end }}

  KEYCLOAK_SSO_ENABLED: {{ .Values.keycloak.enabled | quote }}
{{- if .Values.keycloak.enabled }}
  KEYCLOAK_BASE_URL: {{ required "keycloak.baseUrl is required when keycloak.enabled" .Values.keycloak.baseUrl | quote }}
  {{- with .Values.keycloak.baseUrlInternal }}
  KEYCLOAK_BASE_URL_INTERNAL: {{ . | quote }}
  {{- end }}
  KEYCLOAK_REALM: {{ required "keycloak.realm is required when keycloak.enabled" .Values.keycloak.realm | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  KEYCLOAK_REDIRECT_URI: "https://{{ .Values.app.publicHost }}/admin/auth/keycloak/callback"
{{- end }}
