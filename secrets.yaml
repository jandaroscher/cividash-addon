---
cividash:
  cividash:
    # Laravel APP_KEY (32 characters). When migrating an existing
    # installation, create this Secret with the old key before the first
    # deployment: the generator keeps existing values.
    cividash-app-key:
      app-key:
        length: 32
        generate: true
      componentNamespaces:
        - cividash
    # Password of the database role, read by CloudNativePG in the postgres
    # namespace and by CiviDash.
    db-cividash:
      username: 'cividash'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - cividash
        - postgres
