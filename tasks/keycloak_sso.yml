---
# ---------------------------------------------------------------------------
# Keycloak SSO registration for the cividash add-on.
#
# Mirrors the airflow add-on keycloak_sso.yml in the CIVITAS/CORE deployment
# repo:
#   1. Read the platform keycloak-admin k8s Secret (master realm credentials).
#   2. Obtain an admin access token (master realm, admin-cli, password grant).
#   3. Create/ensure the "cividash" client in the stage (tenant) realm
#      idempotently (tolerate 201 created / 409 already-exists).
#   4. Fetch the generated client-secret.
#   5. Create the client roles "admin" + "editor".
#   6. Provision the NGSI-LD machine token on the shared, operator-provided
#      "api-access" IDM client — NOT on our own cividash client:
#        a. fetch the api-access client-secret via the shared helper
#           tasks/templates/keycloak_client_secret.yaml,
#        b. ensure the purpose-scoped client roles (dataConsumer/dataProducer)
#           that make Keycloak mint the api:read/api:write scopes the CORE
#           APISIX gateway enforces in front of the NGSI-LD broker (Stellio),
#        c. assign those roles to api-access's service account (idempotent).
#   7. Write the Secret cividash-oidc-secret in "{{ k8s_namespace }}" with the
#      keys the CiviDash app env expects (KEYCLOAK_* for Socialite admin SSO from
#      the cividash client, and CIVITAS_OAUTH_* for the NGSI-LD
#      client-credentials machine token from the shared api-access client).
#
# APISIX does NOT consume the cividash client: admin auth is enforced by the
# redpandaconnect_addon's FROST OAuth2 wiring.
# ---------------------------------------------------------------------------

# prepare variables and login to keycloak
- name: Get Admin credentials
  kubernetes.core.k8s_info:
    kubeconfig: '{{ k8s_config }}'
    kind: Secret
    namespace: '{{ inv_access.ns_name }}'
    name: '{{ inv_access.platform.k8s_secret_name }}'
    context: '{{ k8s_context }}'
  register: admin_credentials

- name: Store IDM Credentials
  set_fact:
    ADMIN_USERNAME: "{{ admin_credentials.resources[0].data.MASTER_USERNAME | b64decode }}"
    ADMIN_PASSWORD: "{{ admin_credentials.resources[0].data.MASTER_PASSWORD | b64decode }}"
  no_log: true  # master realm admin credentials

- name: Re-Login to keycloak
  check_mode: no
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/realms/master/protocol/openid-connect/token"
    return_content: yes
    body_format: form-urlencoded
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body:
        grant_type: "password"
        client_id: "admin-cli"
        username: "{{ ADMIN_USERNAME }}"
        password: "{{ ADMIN_PASSWORD }}"
    status_code: 200
  register: keycloak_login
  no_log: true  # admin password in request body + access token in response

# create cividash client in keycloak
- name: Create cividash Client
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    body_format: json
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body: "{{ lookup('template', addon_dir|default('') + 'templates/cividash-keycloak.json.j2') }}"
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 201,409
  register: client_cividash_response

- name: Check if already existing.
  debug:
    msg: "Client may already exist (409) — continuing idempotently."
  when:
    - not ansible_check_mode
    - client_cividash_response.status == 409

- name: Get clients
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 200
  register: clients

- name: "Get keycloak client cividash ID."
  set_fact:
    client_id_cividash: "{{ clients.json | json_query(query) }}"
  vars:
    query: "[?clientId== '{{ cividash_oidc_client_id }}'].id | [0]"

- name: Get Client Secret cividash
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_cividash }}/client-secret"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 200
  register: keycloak_client_cividash_secret_response
  no_log: true  # response contains the client-secret

- name: "Set IDM client secret cividash."
  set_fact:
    IDM_CLIENT_SECRET_CIVIDASH: "{{ keycloak_client_cividash_secret_response.json.value }}"
  no_log: true  # client-secret

# create cividash client roles in keycloak (app-side authorization: admin + editor)
- name: Create cividash roles
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_cividash }}/roles"
    return_content: yes
    body_format: json
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body: |
      {
        "name": "{{ item.role }}",
        "composite": false,
        "clientRole": true
      }
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 201,409
  register: roles_cividash_response
  when:
    - not ansible_check_mode
  loop:
    # mapped to CiviDash app roles via the "groups" client-role claim
    - {role: "admin"}
    - {role: "editor"}

# ---------------------------------------------------------------------------
# NGSI-LD machine token via the shared platform "api-access" client.
#
# The NGSI-LD client-credentials machine token is not issued by our own
# cividash client. We reuse the operator-provided shared api-access
# IDM client — the same client the CORE data plane (Stellio behind APISIX)
# already trusts — exactly as redpandaconnect_addon does for FROST.
#
# The shared helper below performs its own Keycloak admin login and registers
# `keycloak_login`, resolves the client to `id_of_client`, and fetches its
# `client_secret`. Those three facts feed the role-provisioning tasks and the
# CIVITAS_OAUTH_* keys in cividash-oidc-secret.
# ---------------------------------------------------------------------------
- name: "Get Keycloak client secret for the shared api-access client"
  include_tasks: tasks/templates/keycloak_client_secret.yaml
  vars:
    module: "CiviDash"
    client_id: "{{ IDM_CLIENT.API_ACCESS }}"

- name: "Set api-access NGSI-LD OAuth2/Keycloak facts"
  set_fact:
    _cividash_api_access_client_id: "{{ IDM_CLIENT.API_ACCESS }}"
    _cividash_api_access_client_secret: "{{ client_secret }}"
  no_log: true  # api-access client-secret

# The dataConsumer/dataProducer client roles make Keycloak issue the
# api:read/api:write scopes the CORE APISIX gateway enforces in front of the
# NGSI-LD context broker (Stellio). The CiviDash backend both reads and writes
# NGSI-LD entities, so it needs both by default. Override via
# inv_addons.cividash.ngsi_ld_roles if a deployment needs a narrower set.
# (Convention adopted from redpandaconnect_addon, which uses the same two roles
# to obtain the CORE api:read/api:write scopes; see the keep-in-sync note in docs/authentication.md.)
- name: "Determine required api-access scope roles for the NGSI-LD machine token"
  set_fact:
    _cividash_ngsi_ld_roles: "{{ inv_addons.cividash.ngsi_ld_roles | default(['dataConsumer', 'dataProducer']) }}"

- name: "Ensure NGSI-LD scope client roles exist on api-access (idempotent)"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ id_of_client }}/roles"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "{{ item }}"
      description: "Managed by cividash_addon for the NGSI-LD machine token (api:read/api:write scopes)."
    headers:
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: [201, 409]
  loop: "{{ _cividash_ngsi_ld_roles }}"

- name: "Get api-access service account user id"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/users?username=service-account-{{ IDM_CLIENT.API_ACCESS }}&exact=true"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: _cividash_api_access_service_account

- name: "Get definitions of the NGSI-LD scope roles to assign"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ id_of_client }}/roles/{{ item }}"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: _cividash_role_defs
  loop: "{{ _cividash_ngsi_ld_roles }}"

- name: "Assign NGSI-LD scope roles to the api-access service account (idempotent)"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/users/{{ _cividash_api_access_service_account.json[0].id }}/role-mappings/clients/{{ id_of_client }}"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body: "{{ [item.json] }}"
    headers:
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 204
  loop: "{{ _cividash_role_defs.results }}"

# ---------------------------------------------------------------------------
# Persist the resolved OIDC credentials into cividash-oidc-secret. The CiviDash app env
# (loaded by the chart workloads via envFrom secretRef) sources these keys for both the
# Socialite admin SSO (KEYCLOAK_* — from the cividash client) and the
# NGSI-LD client-credentials machine token (CIVITAS_OAUTH_* — from the shared
# api-access client). APISIX does NOT consume this secret.
# ---------------------------------------------------------------------------
- name: Create cividash-oidc-secret
  kubernetes.core.k8s:
    state: present
    force: yes  # recreate so a rotated client-secret propagates
    kubeconfig: "{{ k8s_config }}"
    namespace: "{{ k8s_namespace }}"
    context: '{{ k8s_context }}'
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: cividash-oidc-secret
      data:
        # --- Socialite admin SSO (Keycloak Socialite provider) ---
        # Enables the SSO login button in Filament (config integrations.keycloak_sso.enabled).
        # Without this the KeycloakSsoController code ships but stays inert.
        KEYCLOAK_SSO_ENABLED: "{{ 'true' | b64encode }}"
        KEYCLOAK_BASE_URL: "{{ inv_access.platform.hostname | b64encode }}"
        # In-cluster Keycloak URL for the SERVER-SIDE token exchange in the SSO
        # callback. The browser flow uses the public KEYCLOAK_BASE_URL (https),
        # but the server-side call must hit Keycloak in-cluster over http to
        # avoid relying on the platform's CA being in the app container's trust
        # store (a self-signed CA otherwise yields cURL error 60 -> login loop).
        # Defaults to the CORE Keycloak service; override per platform if named
        # differently.
        KEYCLOAK_BASE_URL_INTERNAL: "{{ (inv_addons.cividash.keycloak_base_url_internal | default('http://idmkeycloak.' ~ ENVIRONMENT ~ '-access-stack.svc.cluster.local')) | b64encode }}"
        KEYCLOAK_REALM: "{{ inv_access.tenant.realm_name | b64encode }}"
        KEYCLOAK_CLIENT_ID: "{{ cividash_oidc_client_id | b64encode }}"
        KEYCLOAK_CLIENT_SECRET: "{{ IDM_CLIENT_SECRET_CIVIDASH | b64encode }}"
        KEYCLOAK_REDIRECT_URI: "{{ ('https://' + (inv_addons.cividash.admin_host | default(inv_addons.cividash.public_host)) + '/admin/auth/keycloak/callback') | b64encode }}"
        # --- CIVITAS NGSI-LD machine token (OAuth client-credentials) ---
        # Issued by the shared, operator-provided api-access client,
        # NOT by cividash. Same realm token endpoint; the client-id/secret
        # come from the shared keycloak_client_secret.yaml helper above.
        CIVITAS_OAUTH_TOKEN_URL: "{{ (inv_access.platform.hostname + '/realms/' + inv_access.tenant.realm_name + '/protocol/openid-connect/token') | b64encode }}"
        CIVITAS_OAUTH_CLIENT_ID: "{{ _cividash_api_access_client_id | b64encode }}"
        CIVITAS_OAUTH_CLIENT_SECRET: "{{ _cividash_api_access_client_secret | b64encode }}"
  no_log: true  # secret payload — KEYCLOAK_* + CIVITAS client-credentials
  when:
    - not ansible_check_mode
