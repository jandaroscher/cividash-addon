---
# =============================================================================
# CIVIDASH Civitas Addon — Secrets
# =============================================================================
# Idempotently provisions two Opaque Secrets in "{{ k8s_namespace }}":
#
#   1) cividash-db-secret   — MariaDB bootstrap credentials.
#        Keys: MARIADB_DATABASE, MARIADB_USER, MARIADB_PASSWORD, MARIADB_ROOT_PASSWORD
#        - MARIADB_DATABASE / MARIADB_USER come from the inventory (fixed, declarative).
#        - MARIADB_PASSWORD / MARIADB_ROOT_PASSWORD are generated ONCE (random) and then
#          preserved across runs (read back from the live Secret), exactly like the
#          airflow addon preserves its Flask / Redis secrets.
#
#   2) cividash-app-secret  — Laravel application environment + APP_KEY.
#        - APP_KEY is generated ONCE as "base64:" + base64(32 random bytes) and preserved.
#        - Holds all NON-DB app env from the CONTRACT (APP_*, SESSION/CACHE/QUEUE drivers,
#          S3, TRUSTED_PROXIES, CIVITAS_* base config).
#        - It does NOT hold DB_PASSWORD: deployments reference DB_PASSWORD/DB_USERNAME/
#          DB_DATABASE directly from cividash-db-secret via secretKeyRef, so DB credentials
#          live in exactly one place (cividash-db-secret).
#        - It does NOT hold the Keycloak/OIDC client secret: that is written separately by
#          tasks/keycloak_sso.yml into cividash-oidc-secret and consumed via secretKeyRef.
#
# Secret-source map (which env comes from which Secret), as wired in the deployments:
#   cividash-app-secret  -> APP_KEY + all APP_* / SESSION_* / CACHE_* / QUEUE_* / AWS_* /
#                       PUBLIC_* / FILESYSTEM_PUBLIC_URL / TRUSTED_PROXIES / CIVITAS_* base
#   cividash-db-secret   -> DB_DATABASE, DB_USERNAME, DB_PASSWORD (+ MARIADB_* for the DB pod)
#   cividash-oidc-secret -> KEYCLOAK_* + CIVITAS client-credentials (written by keycloak_sso.yml)
# =============================================================================

# -----------------------------------------------------------------------------
# 1) MariaDB secret (cividash-db-secret)
# -----------------------------------------------------------------------------
- name: "CIVIDASH: Check if MariaDB Secret already exists"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    kind: Secret
    name: cividash-db-secret
  register: cividash_db_secret_existing

- name: "CIVIDASH: Generate MariaDB application password (first run only)"
  # Strip /+= and truncate to 24 chars intentionally: avoids MySQL/shell-quoting issues.
  ansible.builtin.shell: openssl rand -base64 24 | tr -d '/+=' | cut -c 1-24
  register: cividash_db_password_gen
  changed_when: false
  when: cividash_db_secret_existing.resources | length == 0

- name: "CIVIDASH: Generate MariaDB root password (first run only)"
  ansible.builtin.shell: openssl rand -base64 24 | tr -d '/+=' | cut -c 1-24
  register: cividash_db_root_password_gen
  changed_when: false
  when: cividash_db_secret_existing.resources | length == 0

- name: "CIVIDASH: Resolve MariaDB credentials (preserve existing, else use generated)"
  ansible.builtin.set_fact:
    # Declarative values from inventory (safe to update on every run).
    cividash_db_database: "{{ inv_addons.cividash.db.database | default('cividash') }}"
    cividash_db_user: "{{ inv_addons.cividash.db.username | default('cividash') }}"
    # Secret values: read back from the live Secret if it exists, else use the freshly
    # generated random value. This makes the task idempotent — passwords never rotate
    # silently between runs.
    cividash_db_password: >-
      {{ (cividash_db_secret_existing.resources[0].data.MARIADB_PASSWORD | b64decode)
         if (cividash_db_secret_existing.resources | length > 0)
         else cividash_db_password_gen.stdout }}
    cividash_db_root_password: >-
      {{ (cividash_db_secret_existing.resources[0].data.MARIADB_ROOT_PASSWORD | b64decode)
         if (cividash_db_secret_existing.resources | length > 0)
         else cividash_db_root_password_gen.stdout }}

- name: "CIVIDASH: Apply MariaDB Secret (cividash-db-secret)"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/db_secret.yaml.j2') | from_yaml }}"
  no_log: true  # secret payload — keep credentials out of the log

# -----------------------------------------------------------------------------
# 2) Application secret (cividash-app-secret)
# -----------------------------------------------------------------------------
- name: "CIVIDASH: Check if App Secret already exists"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    kind: Secret
    name: cividash-app-secret
  register: cividash_app_secret_existing

- name: "CIVIDASH: Generate Laravel APP_KEY (first run only)"
  # APP_KEY format expected by Laravel: "base64:" + base64(32 random bytes).
  # openssl rand -base64 32 emits the base64 of 32 raw bytes, so the result is a valid
  # AES-256 key. Generated ONCE and then preserved across runs (see set_fact below).
  ansible.builtin.shell: set -o pipefail && echo "base64:$(openssl rand -base64 32)"
  args:
    executable: /bin/bash
  register: cividash_app_key_gen
  changed_when: false
  when: cividash_app_secret_existing.resources | length == 0

- name: "CIVIDASH: Resolve APP_KEY (preserve existing, else use generated)"
  ansible.builtin.set_fact:
    cividash_app_key: >-
      {{ (cividash_app_secret_existing.resources[0].data.APP_KEY | b64decode)
         if (cividash_app_secret_existing.resources | length > 0)
         else cividash_app_key_gen.stdout }}

- name: "CIVIDASH: Apply App Secret (cividash-app-secret)"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/app_secret.yaml.j2') | from_yaml }}"
  no_log: true  # secret payload — keep credentials out of the log
