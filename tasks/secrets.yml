---
# =============================================================================
# CIVIDASH Civitas Addon — Secrets
# =============================================================================
# Idempotently provisions the application Secret in "{{ k8s_namespace }}":
#
#   cividash-app-secret  — Laravel application environment + APP_KEY.
#        - APP_KEY is generated ONCE as "base64:" + base64(32 random bytes) and preserved.
#        - Holds all NON-DB app env from the CONTRACT (APP_*, SESSION/CACHE/QUEUE drivers,
#          S3, TRUSTED_PROXIES, CIVITAS_* base config).
#        - It does NOT hold the DB connection: DB_CONNECTION/DB_HOST/DB_PORT/DB_DATABASE/
#          DB_USERNAME/DB_PASSWORD live in cividash-db-secret (rendered by tasks/database.yml
#          from the external-Postgres role vars) and are injected via envFrom.
#        - It does NOT hold the Keycloak/OIDC client secret: that is written separately by
#          tasks/keycloak_sso.yml into cividash-oidc-secret and consumed via secretKeyRef.
#
# Secret-source map (which env comes from which Secret), as wired in the deployments:
#   cividash-app-secret  -> APP_KEY + all APP_* / SESSION_* / CACHE_* / QUEUE_* / AWS_* /
#                       PUBLIC_* / FILESYSTEM_PUBLIC_URL / TRUSTED_PROXIES / CIVITAS_* base
#   cividash-db-secret   -> DB_CONNECTION/DB_HOST/DB_PORT/DB_DATABASE/DB_USERNAME/DB_PASSWORD
#                       (external Postgres connection; see tasks/database.yml)
#   cividash-oidc-secret -> KEYCLOAK_* + CIVITAS client-credentials (written by keycloak_sso.yml)
# =============================================================================

# -----------------------------------------------------------------------------
# Application secret (cividash-app-secret)
# -----------------------------------------------------------------------------
- name: "CIVIDASH: Check if App Secret already exists"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    kind: Secret
    name: cividash-app-secret
  register: cividash_app_secret_existing

- name: "CIVIDASH: Generate Laravel APP_KEY (first run only)"
  # APP_KEY format expected by Laravel: "base64:" + base64(32 random bytes).
  # openssl rand -base64 32 emits the base64 of 32 raw bytes, so the result is a valid
  # AES-256 key. Generated ONCE and then preserved across runs (see set_fact below).
  ansible.builtin.shell: set -o pipefail && echo "base64:$(openssl rand -base64 32)"
  args:
    executable: /bin/bash
  register: cividash_app_key_gen
  changed_when: false
  when: cividash_app_secret_existing.resources | length == 0

- name: "CIVIDASH: Resolve APP_KEY (preserve existing, else use generated)"
  ansible.builtin.set_fact:
    cividash_app_key: >-
      {{ (cividash_app_secret_existing.resources[0].data.APP_KEY | b64decode)
         if (cividash_app_secret_existing.resources | length > 0)
         else cividash_app_key_gen.stdout }}

- name: "CIVIDASH: Apply App Secret (cividash-app-secret)"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/app_secret.yaml.j2') | from_yaml }}"
  no_log: true  # secret payload — keep credentials out of the log
