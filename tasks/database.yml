---
# =============================================================================
# =============================================================================
# The add-on does not run a database server itself; it connects to an
# EXTERNALLY provisioned Postgres. The Helm chart renders the connection Secret
# (cividash-db-secret) (chart/cividash/templates/db-secret.yaml)
# from the same inv_addons.cividash.db.* values, via values.yaml.j2. This
# file holds only the OPTIONAL controller-side connectivity check.
#
# `wait_for` runs on the Ansible controller, so it only works when the DB
# endpoint is reachable from there. It is DISABLED by default because an
# in-cluster-only Postgres (e.g. a Zalando cluster Service) is not reachable
# from the controller; enable it with `cividash_db_readiness_check: true` when the
# endpoint is reachable.
# =============================================================================

- name: "CiviDash: Wait for external Postgres to accept TCP connections (optional)"
  ansible.builtin.wait_for:
    host: "{{ inv_addons.cividash.db.host }}"
    port: "{{ inv_addons.cividash.db.port | default(5432) | int }}"
    timeout: "{{ cividash_db_readiness_timeout | default(60) | int }}"
  when: cividash_db_readiness_check | default(false) | bool
