---
# =============================================================================
# CiviDash add-on — top-level orchestration
# -----------------------------------------------------------------------------
# Packages the CiviDash Laravel dashboard as a CIVITAS/CORE add-on. Deployed via
# the central platform Helm wrapper (tasks/templates/k8s-helm.yml) against the
# local chart in chart/cividash/, plus uri-based Keycloak/APISIX admin-API
# calls for SSO and gateway registration (those are NOT Helm's job).
#
# Object names are fixed (the cividash-web image hard-codes cividash-fpm:9000;
# the docs reference them): cividash-app-secret, cividash-db-secret,
# cividash-fpm, cividash-web, cividash-queue, cividash-scheduler,
# cividash-migrate, cividash-seed, cividash-public.
# =============================================================================

# -----------------------------------------------------------------------------
# K8s connection facts (kubeconfig / context / namespace).
# -----------------------------------------------------------------------------
- name: Set default facts for K8S
  ansible.builtin.set_fact:
    k8s_config: "{{ K8S_KUBECONFIG_PATH }}/{{ inv_addons.cividash.ns_kubeconfig }}"
    k8s_context: "{{ inv_k8s.config.context }}"
    k8s_namespace: "{{ inv_addons.cividash.ns_name }}"
  tags: ["addons", "addon_cividash"]

- name: "Create namespace {{ k8s_namespace }}"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      api_version: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"
        labels:
          name: "{{ k8s_namespace }}"
  when: inv_addons.cividash.ns_create
  tags: ["addons", "addon_cividash"]

# -----------------------------------------------------------------------------
# Validate that the inventory supplies the keys the chart values need.
# Fail fast with a clear message rather than rendering broken Helm values.
# -----------------------------------------------------------------------------
- name: "CiviDash: Validate required inventory keys"
  ansible.builtin.assert:
    that:
      # Keycloak client for Socialite admin SSO; the NGSI-LD token comes from
      # the shared api-access client, not this one
      - inv_addons.cividash.oidc_client_id is defined
      - inv_addons.cividash.oidc_client_id | length > 0
      # External PostgreSQL connection (R1 resolved: CORE-native Postgres,
      # provisioned OUTSIDE the add-on). host + password are REQUIRED and come
      # from the (vaulted) inventory; database/username/port fall back to
      # sensible defaults in the chart values.
      - inv_addons.cividash.db is defined
      - inv_addons.cividash.db.host is defined
      - inv_addons.cividash.db.host | length > 0
      - inv_addons.cividash.db.password is defined
      - inv_addons.cividash.db.password | length > 0
      # S3 credentials (vaulted): rendered into cividash-app-secret as AWS_*.
      - inv_addons.cividash.s3.access_key_id is defined
      - inv_addons.cividash.s3.access_key_id | length > 0
      - inv_addons.cividash.s3.secret_access_key is defined
      - inv_addons.cividash.s3.secret_access_key | length > 0
    fail_msg: >-
      Missing required keys in inv_addons.cividash.
      Expected: oidc_client_id, the vaulted external-Postgres db.{host,password}
      (db.{database,username,port} default in the chart values), and the
      vaulted s3.{access_key_id,secret_access_key}.
    success_msg: "CiviDash: required inventory keys present."
  tags: ["addons", "addon_cividash"]

# public_host only matters when ingress/APISIX are enabled (both gated on
# enable_ingress). Assert it only then, so enable_ingress: false deploys
# (no Ingress, no APISIX route) don't require a public_host.
- name: "CiviDash: Validate public_host (ingress enabled)"
  ansible.builtin.assert:
    that:
      - inv_addons.cividash.public_host is defined
      - inv_addons.cividash.public_host | length > 0
    fail_msg: >-
      inv_addons.cividash.public_host is required when enable_ingress
      is true (it backs the public Ingress and the APISIX route).
    success_msg: "CiviDash: public_host present for ingress."
  when: inv_addons.cividash.enable_ingress | default(true)
  tags: ["addons", "addon_cividash"]

# -----------------------------------------------------------------------------
# Optional controller-side DB readiness probe (see tasks/database.yml header).
# -----------------------------------------------------------------------------
- name: "CiviDash: Optional external Postgres readiness probe"
  ansible.builtin.include_tasks: "{{ addon_dir | default('') + 'tasks/database.yml' }}"
  tags: ["addons", "addon_cividash"]

# -----------------------------------------------------------------------------
# Keycloak SSO: register the "cividash" client (Socialite admin SSO) and
# the shared api-access NGSI-LD machine-token roles, writing cividash-oidc-secret.
# Runs BEFORE Helm so the workloads' envFrom secretRef: cividash-oidc-secret finds
# it already in place.
# -----------------------------------------------------------------------------
- name: "CiviDash: Configure Keycloak SSO client"
  ansible.builtin.include_tasks: "{{ addon_dir | default('') + 'tasks/keycloak_sso.yml' }}"
  tags: ["addons", "addon_cividash"]

# M2M preflight: with the api-access facts from keycloak_sso in hand, verify
# the shared api-access client can actually mint a USABLE NGSI-LD machine
# token (serviceAccountsEnabled + non-empty tenants claim) BEFORE we deploy
# workloads. These are OPERATOR provisioning prerequisites the add-on only
# probes — it fails loudly rather than deploying a dashboard that cannot
# reach Stellio. Skip with m2m_preflight_enabled: false.
- name: "CiviDash: M2M preflight (api-access NGSI-LD token check)"
  ansible.builtin.include_tasks: "{{ addon_dir | default('') + 'tasks/preflight_m2m.yml' }}"
  when: inv_addons.cividash.m2m_preflight_enabled | default(true)
  tags: ["addons", "addon_cividash"]

# -----------------------------------------------------------------------------
# Install via the central platform Helm task, against the LOCAL chart
# (chart/cividash/). helm_repo_name / helm_chart_version are deliberately
# NOT passed so tasks/templates/k8s-helm.yml takes its "local chart" branch.
# helm_chart_reference is anchored at playbook_dir: kubernetes.core.helm's
# chart_ref is `type: path` (expanduser only, no absolutizing) and the local
# connection plugin shells out with cwd=None, i.e. the ansible-playbook
# process's own cwd (the CORE repo root), not playbook_dir — so a bare
# "{{ addon_dir }}chart/..." would resolve relative to the wrong directory.
# The chart itself creates cividash-app-secret / cividash-db-secret (pre-install /
# pre-upgrade hooks) and runs cividash-migrate (pre-install/pre-upgrade hook,
# after the secrets) before the fpm/web/queue/scheduler workloads.
# APP_KEY idempotency is a Helm `lookup` in the chart.
# -----------------------------------------------------------------------------
- name: "CiviDash: Install via Helm (local chart)"
  ansible.builtin.include_tasks:
    file: tasks/templates/k8s-helm.yml
    # include_tasks does not pass tags down to the included file; apply them so
    # a `--tags addons` run does not skip the Helm task itself.
    apply:
      tags: ["addons", "addon_cividash"]
  vars:
    helm_release_name: "{{ software.addon_cividash.helm_release_name }}"
    helm_chart_reference: "{{ playbook_dir }}/{{ addon_dir }}chart/cividash"
    helm_values_file: "{{ addon_dir }}templates/values.yaml.j2"
    helm_values_rcombine: "{{ inv_addons.cividash.helm_values | default({}) }}"
    helm_create_namespace: "{{ inv_addons.cividash.ns_create }}"
    helm_no_log: true
  tags: ["addons", "addon_cividash"]

# -----------------------------------------------------------------------------
# APISIX: OPEN routes only (R2). One route per public_host, uri /* ->
# cividash-web upstream. NO openid-connect/auth plugin — the Laravel/Filament
# app enforces its own auth (Fortify + optional Keycloak Socialite SSO).
# Runs AFTER Helm so the cividash-web Service already exists.
# -----------------------------------------------------------------------------
- name: "CiviDash: Configure APISIX open routes"
  ansible.builtin.include_tasks: "{{ addon_dir | default('') + 'tasks/apisix.yml' }}"
  when: inv_addons.cividash.enable_ingress | default(true)
  tags: ["addons", "addon_cividash"]
