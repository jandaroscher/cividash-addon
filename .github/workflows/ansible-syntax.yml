name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Install ansible-core
        run: |
          pip install ansible-core
          ansible-galaxy collection install kubernetes.core
      - name: Ansible syntax check
        run: ansible-playbook --syntax-check dev/syntax-check.yml
      - name: Render default_inventory.yml
        # CORE renders the file with lookup('template', errors='warn') | default({}),
        # so any undefined variable silently drops the whole default inventory.
        run: |
          python - <<'PY'
          import jinja2, yaml
          env = jinja2.Environment(undefined=jinja2.StrictUndefined)
          src = open("default_inventory.yml").read()
          out = env.from_string(src).render(DOMAIN="example.org", ENVIRONMENT="ci")
          addon = yaml.safe_load(out)["all"]["children"]["controller"]["vars"]["inv_addons"]["cividash"]
          assert addon["ns_name"] == "ci-cividash-stack", addon["ns_name"]
          PY
      - name: Helm lint
        run: |
          helm lint chart/cividash
          helm lint chart/cividash -f chart/cividash/ci/smoke-values.yaml
