# Default values for the cividash chart.

images:
  app:
    registry: ghcr.io
    repository: jandaroscher/cividash-app
    # Chart-default only, for lint/template; real installs get this
    # overridden by the Ansible values from vars/software_references.yml
    # (see README, "Versioning and compatibility") to the immutable
    # civitas-<gitsha> tag. Never leave "civitas" (a moving tag) in an
    # inventory.
    tag: civitas
    pullPolicy: Always
  web:
    registry: ghcr.io
    repository: jandaroscher/cividash-web
    # Chart-default only, for lint/template; real installs get this
    # overridden by the Ansible values from vars/software_references.yml
    # (see README, "Versioning and compatibility") to the immutable
    # civitas-<gitsha> tag. Never leave "civitas" (a moving tag) in an
    # inventory.
    tag: civitas
    pullPolicy: Always
  # Set to a non-empty string to reference an existing imagePullSecrets Secret.
  pullSecret: ""

replicas:
  fpm: 2
  web: 2

app:
  # Public host the app is served on (also used for the Ingress/HTTPRoute
  # host). Required when ingress.enabled or gatewayApi.enabled is true.
  publicHost: ""
  # APP_KEY ("base64:" + 32 random bytes). Leave empty to resolve it at install
  # time: reuse the existing cividash-app-secret's APP_KEY if the release already
  # exists, otherwise generate a fresh one. NOTE: `helm template` has no cluster
  # to look up, so it always renders a freshly generated key — this is expected
  # and harmless for `helm lint`/`helm template`; real installs preserve the key
  # via the Secret hook (see docs/helm-chart.md).
  key: ""
  # Production defaults. LOG_CHANNEL=stderr suits containers (captured by the
  # cluster's log driver instead of writing to a file no one rotates).
  # SESSION_SECURE_COOKIE requires TLS in front of cividash-web (true by default
  # since ingress.sslRedirect / the Gateway API path both terminate TLS).
  logLevel: info
  logChannel: stderr
  sessionSecureCookie: true
  civitasApiUrl: ""
  s3:
    accessKeyId: ""
    secretAccessKey: ""
    endpoint: ""
    bucket: ""
    publicUrl: ""
    region: us-east-1

db:
  host: ""
  port: 5432
  database: cividash
  username: cividash
  password: ""

ingress:
  # Off by default: app.publicHost must be set before enabling. The Ansible
  # values template (templates/values.yaml.j2) sets this explicitly per
  # environment.
  enabled: false
  className: ""
  tlsSecretName: ""
  clusterIssuer: ""
  sslRedirect: true

# Gateway API (HTTPRoute) is an alternative to the Ingress above. Both can be
# disabled independently; enabling gatewayApi does not disable ingress.
gatewayApi:
  enabled: false
  parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-system

# Initial config data, seeded by the cividash-seed Helm hook Job (post-install,
# post-upgrade) after migrate/workloads. Every step is idempotent, see
# templates/cividash-seed.yaml.
seed:
  enabled: true
  # The CiviDash pages:seed/dashboard:seed seeders hardcode the tenant slug
  # "default" (BelongsToTenant creating-hook + DashboardSeedCommand fallback
  # chain), so `pages: true` or a non-empty `dashboardJsonUrl` require this to
  # stay "default" — the chart refuses to render otherwise.
  defaultTenant: default
  # Set the default tenant's `domain` to app.publicHost. Only writes when the
  # domain actually differs.
  setTenantDomain: true
  # Off by default: seeds the reference pages/navigation (php artisan
  # pages:seed). Idempotent, safe to leave on, but only meaningful for the
  # Regensburg reference content. Requires defaultTenant: default.
  pages: false
  # Non-empty: seeds Tiles/Categories/Metrics from a dashboard.json URL
  # (php artisan dashboard:seed --url=...). Idempotent. Empty = skipped.
  # Requires defaultTenant: default.
  dashboardJsonUrl: ""

resources:
  fpm:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  web:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
  queue:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  scheduler:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  migrate:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  seed:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
