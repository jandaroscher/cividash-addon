{{/*
cividash-app-secret — Laravel application environment + APP_KEY.
Rendered as a pre-install/pre-upgrade hook (weight 0) so it exists before the
cividash-migrate Job (weight 5) and the workloads run; "before-hook-creation" keeps
it in place afterwards (no hook-succeeded delete) for envFrom to pick up.
*/}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: cividash-app-secret
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-app
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
stringData:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://{{ .Values.app.publicHost }}"
  APP_KEY: {{ include "cividash.appKey" . | quote }}
  TRUSTED_PROXIES: "*"

  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  LOG_CHANNEL: {{ .Values.app.logChannel | quote }}

  SESSION_DRIVER: "database"
  SESSION_SECURE_COOKIE: {{ .Values.app.sessionSecureCookie | quote }}
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"

  PUBLIC_DISK_DRIVER: "s3"
  AWS_ACCESS_KEY_ID: {{ .Values.app.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.app.s3.secretAccessKey | quote }}
  AWS_DEFAULT_REGION: {{ .Values.app.s3.region | quote }}
  AWS_ENDPOINT: {{ .Values.app.s3.endpoint | quote }}
  PUBLIC_S3_BUCKET: {{ .Values.app.s3.bucket | quote }}
  FILESYSTEM_PUBLIC_URL: {{ .Values.app.s3.publicUrl | quote }}

  CIVITAS_ENABLED: "true"
  CIVITAS_DRIVER: "ngsi-ld"
  CIVITAS_API_URL: "{{ .Values.app.civitasApiUrl }}/context/ngsi-ld"
