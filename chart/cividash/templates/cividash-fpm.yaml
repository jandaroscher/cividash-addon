apiVersion: apps/v1
kind: Deployment
metadata:
  name: cividash-fpm
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-fpm
spec:
  replicas: {{ .Values.replicas.fpm }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cividash-fpm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cividash.labels" . | nindent 8 }}
        app.kubernetes.io/name: cividash-fpm
    spec:
      {{- if .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.images.pullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fpm
          image: {{ include "cividash.appImage" . }}
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 82
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - secretRef:
                name: cividash-app-secret
            - secretRef:
                name: cividash-oidc-secret
            - secretRef:
                name: cividash-db-secret
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.fpm | nindent 12 }}
---
# Service name MUST stay "cividash-fpm" — the cividash-web nginx image has
# fastcgi_pass cividash-fpm:9000 baked in.
apiVersion: v1
kind: Service
metadata:
  name: cividash-fpm
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-fpm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cividash-fpm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: fastcgi
      port: 9000
      targetPort: 9000
