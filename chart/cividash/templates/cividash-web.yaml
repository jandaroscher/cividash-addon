apiVersion: apps/v1
kind: Deployment
metadata:
  name: cividash-web
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cividash-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cividash.labels" . | nindent 8 }}
        app.kubernetes.io/name: cividash-web
    spec:
      {{- if .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.images.pullSecret }}
      {{- end }}
      # cividash-web is built on nginxinc/nginx-unprivileged: every process runs as
      # the nginx user (uid 101) and listens on 8080, so no capability is needed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "cividash.webImage" . }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cividash-web
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cividash-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      # Service stays on 80 for Ingress/HTTPRoute/APISIX; the container listens on 8080.
      targetPort: 8080
