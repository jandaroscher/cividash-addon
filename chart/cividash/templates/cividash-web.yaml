apiVersion: apps/v1
kind: Deployment
metadata:
  name: cividash-web
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cividash-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cividash.labels" . | nindent 8 }}
        app.kubernetes.io/name: cividash-web
    spec:
      {{- if .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.images.pullSecret }}
      {{- end }}
      # nginx:alpine master runs as root by design; non-root hardening
      # (nginxinc/nginx-unprivileged) is a follow-up in the cividash-web image.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "cividash.webImage" . }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cividash-web
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cividash-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 80
