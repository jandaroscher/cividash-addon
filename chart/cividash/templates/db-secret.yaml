{{/*
cividash-db-secret — external PostgreSQL connection. Same hook timing as
cividash-app-secret (see that template's comment).
*/}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: cividash-db-secret
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
    app.kubernetes.io/name: cividash-db
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
stringData:
  DB_CONNECTION: "pgsql"
  DB_HOST: {{ .Values.db.host | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_DATABASE: {{ .Values.db.database | quote }}
  DB_USERNAME: {{ .Values.db.username | quote }}
  DB_PASSWORD: {{ .Values.db.password | quote }}
