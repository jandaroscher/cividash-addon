{{- if .Values.platformCa }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cividash-platform-ca
  labels:
    {{- include "cividash.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.platformCa | nindent 4 }}
  platform-ca.ini: |
    curl.cainfo = /ca-bundle/ca-bundle.crt
    openssl.cafile = /ca-bundle/ca-bundle.crt
{{- end }}
