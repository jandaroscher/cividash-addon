---
addon_dir: "addons/cividash_addon/"

# Default Keycloak client ID for CiviDash, used when
# inv_addons.cividash.oidc_client_id is unset. Used by the APP for the
# Socialite admin SSO only, NOT by APISIX: the APISIX route is open; admin auth
# is handled by the app (see docs/authentication.md).
IDM_CLIENT_CIVIDASH: "cividash"

# -----------------------------------------------------------------------------
# Database connection — role defaults.
# -----------------------------------------------------------------------------
# The add-on bundles no database server. tasks/database.yml resolves the
# connection into the `cividash_db` fact, which templates/values.yaml.j2
# renders into cividash-db-secret (chart/cividash/templates/db-secret.yaml):
#   db.central   true: database + role in the central CORE Postgres, credentials
#                from the operator-created Secret (host/port/username/password
#                below are then ignored)
#   db.host      (REQUIRED unless db.central — the Postgres endpoint)
#   db.port      (defaults to 5432)
#   db.database  (defaults to "cividash")
#   db.username  (defaults to "cividash")
#   db.password  (REQUIRED unless db.central — supply via VAULT, never hardcode)
#
# host/password have no default on purpose: tasks/cividash.yml asserts they
# are non-empty unless db.central is set.
