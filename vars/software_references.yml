# -----------------------------------------------------------------------------
# Software dependencies of the CiviDash CIVITAS/CORE add-on
# -----------------------------------------------------------------------------
#
# Image dependencies must appear as
# - software.addon_cividash.<component>.registry
# - software.addon_cividash.<component>.repository
# - software.addon_cividash.<component>.tag
#
# to support private registries, which is a platform core feature.
# The platform override inv_op_stack.private_registry.registry_full_url, when
# set, wins over the per-component registry below (see templates/values.yaml.j2).
#
# For more details, see https://docs.core.civitasconnect.digital/docs/Deployment/Private-Registry-Support
#
# Images are built and published by the CiviDash main repository to GHCR:
#   cividash_app -> php-fpm, full Laravel app (used by fpm, queue, scheduler, migrate, seed)
#   cividash_web -> nginx + baked public assets (fastcgi_pass cividash-fpm:9000)
#
# Tags are pinned to an immutable "civitas-<gitsha>" build tag (see README,
# "Versioning and compatibility"). The moving "civitas" tag is also published
# be used in inventories: it can change under a running deployment without
# any version bump here. The pinned tag corresponds to CiviDash 1.0.0.
# Override in your platform inventory (software.addon_cividash.<image>.tag).
# -----------------------------------------------------------------------------

---
software:
  addon_cividash:
    # Local chart (no helm_repo_name/url): tasks/cividash.yml passes
    # helm_chart_reference: "{{ playbook_dir }}/{{ addon_dir }}chart/cividash"
    # and does NOT
    # forward helm_chart_version to the k8s-helm.yml wrapper, so its
    # "local chart" branch runs (helm_chart_version and helm_repo_name both
    # undefined). helm_chart_version here is metadata for humans/tooling only.
    helm_chart_name: "cividash"
    helm_release_name: "cividash"
    helm_chart_version: "1.6.1"

    # php-fpm image: the full Laravel/Filament application.
    cividash_app:
      registry: "ghcr.io"
      repository: "jandaroscher/cividash-app"
    # nginx image: serves the baked public assets and proxies PHP to cividash-fpm:9000.
    cividash_web:
      registry: "ghcr.io"
      repository: "jandaroscher/cividash-web"
