description:
  de:
    shortDescription: "CIVITAS/CORE-Add-on für das CiviDash-Nachhaltigkeitsdashboard"
    longDescription: >
      Packt CiviDash, das Open-Source-Nachhaltigkeitsdashboard für Kommunen, als
      CIVITAS/CORE-Add-on: eine Ansible-Rolle plus lokales Helm-Chart für die
      Installation über den zentralen Plattform-Helm-Task, dazu Keycloak-SSO- und
      APISIX-Gateway-Anbindung. Reine Deploy-Logik, der Anwendungscode liegt im
      CiviDash-Hauptrepository, das hier als vorgebaute Container-Images einfließt.
    features:
      - Installation über den zentralen CIVITAS/CORE-Plattform-Helm-Task
      - Keycloak-SSO für den Admin-Bereich über einen eigenen Keycloak-Client
      - NGSI-LD-Maschinentoken über den gemeinsamen api-access-Client
      - Anbindung an eine externe PostgreSQL-Datenbank und S3-Medienspeicher
      - Idempotente Datenbankmigration und Erstbefüllung als Helm-Hook-Jobs
    documentation: "https://gitlab.opencode.de/regensburg_next/cividash-addon/-/blob/main/README.md"
  en:
    shortDescription: "CIVITAS/CORE add-on for the CiviDash sustainability dashboard"
    longDescription: >
      Packages CiviDash, the open-source sustainability dashboard for municipalities,
      as a CIVITAS/CORE add-on: an Ansible role plus a local Helm chart installed
      through the central platform Helm task, with Keycloak SSO and APISIX gateway
      wiring. Deploy-only logic; the application code lives in the CiviDash main
      repository and ships here as prebuilt container images.
    features:
      - Installation über den zentralen CIVITAS/CORE-Plattform-Helm-Task
      - Keycloak-SSO für den Admin-Bereich über einen eigenen Keycloak-Client
      - NGSI-LD-Maschinentoken über den gemeinsamen api-access-Client
      - Anbindung an eine externe PostgreSQL-Datenbank und S3-Medienspeicher
      - Idempotente Datenbankmigration und Erstbefüllung als Helm-Hook-Jobs
    documentation: "https://gitlab.opencode.de/regensburg_next/cividash-addon/-/blob/main/README.md"
