description:
  de:
    shortDescription: "CIVITAS/CORE-Add-on für das CiviDash-Nachhaltigkeitsdashboard"
    longDescription: >
      Packt CiviDash, das Open-Source-Nachhaltigkeitsdashboard für Kommunen, als
      CIVITAS/CORE-2-Add-on: eine Helmfile-Komponente mit lokalem Helm-Chart, dazu
      Keycloak-Client, Datenbank, Secrets und Network Policies über die
      Konfigurationsdateien des Cores. Reine Deploy-Logik, der Anwendungscode liegt im
      CiviDash-Hauptrepository, das hier als vorgebaute Container-Images einfließt.
    features:
      - Installation als Helmfile-Komponente von CIVITAS/CORE 2
      - Eigener Keycloak-Client mit den Rollen admin und editor
      - Datenbank im Postgres-Cluster des Cores, Medienspeicher auf S3 oder einem Kubernetes-Volume
      - Generierte Secrets, Network Policies und Linkerd-Anbindung
      - Idempotente Datenbankmigration und Erstbefüllung als Helm-Hook-Jobs
    documentation: "https://github.com/jandaroscher/cividash-addon/blob/main/README.md"
  en:
    shortDescription: "CIVITAS/CORE add-on for the CiviDash sustainability dashboard"
    longDescription: >
      Packages CiviDash, the open-source sustainability dashboard for municipalities,
      as a CIVITAS/CORE 2 add-on: a Helmfile component with a local Helm chart,
      plus a Keycloak client, database, secrets and network policies through the
      core's configuration files. Deploy-only logic; the application code lives in the CiviDash main
      repository and ships here as prebuilt container images.
    features:
      - Installs as a CIVITAS/CORE 2 Helmfile component
      - Dedicated Keycloak client with the roles admin and editor
      - Database in the core's Postgres cluster, media on S3 or a Kubernetes volume
      - Generated secrets, network policies and Linkerd integration
      - Idempotent database migration and initial data seed as Helm hook Jobs
    documentation: "https://github.com/jandaroscher/cividash-addon/blob/main/README.md"
