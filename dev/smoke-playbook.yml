---
# =============================================================================
# Local kind smoke playbook for the cividash-addon.
#
# Deploys the add-on's data-plane into a local kind cluster via the SAME Helm
# path production uses (dev/k8s-helm.yml, a vendored copy of the CORE
# k8s-helm.yml wrapper's "local chart" branch — see dev/README.md), against
# the REAL chart in chart/cividash/ — so this exercises the actual chart,
# not a copy.
#
# The add-on bundles no database, so this playbook stands up a throwaway
# in-cluster PostgreSQL (cividash-smoke-postgres) that stands in for the operator-
# provided external Postgres; smoke-vars.yml points db.host at it, and the
# chart renders cividash-db-secret from that.
#
# Skipped vs. a full CORE deploy (they need a real control plane):
#   - tasks/keycloak_sso.yml  -> replaced by a placeholder cividash-oidc-secret
#   - tasks/apisix.yml        -> not run (no APISIX admin API locally)
#   - Ingress                 -> enable_ingress=false in smoke-vars.yml
#
# Run via dev/run-smoke.sh (which creates the cluster, loads images, computes
# the gateway IP, and sets ansible_python_interpreter to ansible's bundled
# python where the `kubernetes` lib is installed).
# =============================================================================
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - smoke-vars.yml
  vars:
    addon_dir: "{{ playbook_dir }}/../"
    k8s_config: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}"
    k8s_context: "{{ inv_k8s.config.context }}"
    k8s_namespace: "{{ inv_addons.cividash.ns_name }}"
  tasks:
    - name: "Smoke: ensure namespace"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k8s_config }}"
        context: "{{ k8s_context }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_namespace }}"

    # Throwaway PostgreSQL — stands in for the operator-provided external DB.
    # Not part of the add-on; it only exists so the smoke has something to
    # migrate against. emptyDir storage (data is thrown away with the cluster).
    - name: "Smoke: throwaway PostgreSQL (cividash-smoke-postgres)"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k8s_config }}"
        context: "{{ k8s_context }}"
        namespace: "{{ k8s_namespace }}"
        definition:
          - apiVersion: v1
            kind: Service
            metadata:
              name: cividash-smoke-postgres
              labels:
                app.kubernetes.io/name: cividash-smoke-postgres
            spec:
              selector:
                app.kubernetes.io/name: cividash-smoke-postgres
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: cividash-smoke-postgres
              labels:
                app.kubernetes.io/name: cividash-smoke-postgres
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: cividash-smoke-postgres
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: cividash-smoke-postgres
                spec:
                  containers:
                    - name: postgres
                      image: "postgres:16-alpine"
                      env:
                        - name: POSTGRES_DB
                          value: "{{ inv_addons.cividash.db.database }}"
                        - name: POSTGRES_USER
                          value: "{{ inv_addons.cividash.db.username }}"
                        - name: POSTGRES_PASSWORD
                          value: "{{ inv_addons.cividash.db.password }}"
                        # postgres writes a lock file under PGDATA; keep it on the
                        # emptyDir mount by using a subdir it fully owns.
                        - name: PGDATA
                          value: /var/lib/postgresql/data/pgdata
                      ports:
                        - containerPort: 5432
                      readinessProbe:
                        exec:
                          command: ["pg_isready", "-U", "{{ inv_addons.cividash.db.username }}", "-d", "{{ inv_addons.cividash.db.database }}"]
                        initialDelaySeconds: 5
                        periodSeconds: 5
                      volumeMounts:
                        - name: data
                          mountPath: /var/lib/postgresql/data
                  volumes:
                    - name: data
                      emptyDir: {}

    - name: "Smoke: wait for throwaway PostgreSQL to be ready"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_config }}"
        context: "{{ k8s_context }}"
        namespace: "{{ k8s_namespace }}"
        kind: Deployment
        name: cividash-smoke-postgres
      register: smoke_pg
      until:
        - smoke_pg.resources | length > 0
        - smoke_pg.resources[0].status.readyReplicas is defined
        - smoke_pg.resources[0].status.readyReplicas == 1
      retries: 30
      delay: 5

    # keycloak_sso.yml is skipped locally; the chart's workloads reference
    # cividash-oidc-secret via envFrom, so create a placeholder (SSO disabled,
    # empty creds -> the NGSI-LD client falls back to anonymous, which the
    # open local broker accepts). Must exist BEFORE the Helm install below.
    - name: "Smoke: placeholder cividash-oidc-secret (keycloak_sso skipped)"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k8s_config }}"
        context: "{{ k8s_context }}"
        namespace: "{{ k8s_namespace }}"
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: cividash-oidc-secret
            labels:
              app.kubernetes.io/part-of: cividash
          stringData:
            KEYCLOAK_SSO_ENABLED: "false"
            KEYCLOAK_BASE_URL: ""
            KEYCLOAK_REALM: ""
            KEYCLOAK_CLIENT_ID: "cividash"
            KEYCLOAK_CLIENT_SECRET: ""
            CIVITAS_OAUTH_CLIENT_ID: ""
            CIVITAS_OAUTH_CLIENT_SECRET: ""

    - name: "Smoke: install cividash via Helm (local chart, same path as production)"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/k8s-helm.yml"
      vars:
        helm_release_name: "cividash"
        helm_chart_reference: "{{ addon_dir }}chart/cividash"
        helm_values_file: "{{ addon_dir }}templates/values.yaml.j2"
        helm_values_rcombine: "{{ inv_addons.cividash.helm_values | default({}) }}"
        helm_create_namespace: false
